<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MugX Photoshop Panel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #1e1e1e;
            color: #ffffff;
        }
        h1 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #61dafb;
        }
        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .status.connected {
            background: #1b5e20;
            border: 1px solid #4caf50;
        }
        .status.error {
            background: #b71c1c;
            border: 1px solid #f44336;
        }
        .btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin: 4px;
        }
        .btn:hover {
            background: #1976d2;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .result {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .button-group {
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <h1>MugX Photoshop Bridge</h1>
    
    <div id="status" class="status">Connecting...</div>
    
    <div class="button-group">
        <button class="btn" id="btnPing" disabled>Ping Photoshop</button>
        <button class="btn" id="btnInfo" disabled>Get PS Info</button>
        <button class="btn" id="btnDoc" disabled>Get Doc Info</button>
        <button class="btn" id="btnLayers" disabled>Get Layers</button>
        <button class="btn" id="btnTest" disabled>Add Test Layer</button>
    </div>
    
    <div id="result" class="result">Waiting for connection...</div>
    
    <script src="CSInterface.js"></script>
    <script>
        var csInterface = new CSInterface();
        var statusEl = document.getElementById('status');
        var resultEl = document.getElementById('result');
        
        // Enable buttons when connected
        function setConnected(connected) {
            var buttons = document.querySelectorAll('.btn');
            buttons.forEach(function(btn) {
                btn.disabled = !connected;
            });
        }
        
        // Log result to panel
        function logResult(data) {
            resultEl.textContent = JSON.stringify(data, null, 2);
        }
        
        // Log error to panel
        function logError(message) {
            resultEl.textContent = 'ERROR: ' + message;
            statusEl.className = 'status error';
            statusEl.textContent = 'Error';
        }
        
        // Call ExtendScript function
        function callBridge(functionName, args) {
            var script = 'MugXBridge.' + functionName + '(' + (args || '') + ')';
            
            csInterface.evalScript(script, function(result) {
                if (result === 'EvalScript error.') {
                    logError('EvalScript error. Check Photoshop console for details.');
                    return;
                }
                
                try {
                    // Parse the returned object string
                    var parsed = eval('(' + result + ')');
                    logResult(parsed);
                    
                    if (parsed && parsed._error) {
                        statusEl.className = 'status error';
                        statusEl.textContent = 'Bridge Error: ' + parsed.message;
                    } else if (parsed && parsed.success) {
                        statusEl.className = 'status connected';
                        statusEl.textContent = 'Connected - ' + (parsed.appName || 'Photoshop');
                    }
                } catch (e) {
                    logError('Parse error: ' + e.message + '\nRaw result: ' + result);
                }
            });
        }
        
        // Initialize panel
        function init() {
            // Test connection
            callBridge('pingPhotoshop', '');
            
            // Set up button handlers
            document.getElementById('btnPing').addEventListener('click', function() {
                callBridge('pingPhotoshop', '');
            });
            
            document.getElementById('btnInfo').addEventListener('click', function() {
                callBridge('getPhotoshopInfo', '');
            });
            
            document.getElementById('btnDoc').addEventListener('click', function() {
                callBridge('getDocumentInfo', '');
            });
            
            document.getElementById('btnLayers').addEventListener('click', function() {
                callBridge('getLayerList', '');
            });
            
            document.getElementById('btnTest').addEventListener('click', function() {
                callBridge('addTestLayer', '');
            });
        }
        
        // Start initialization
        setTimeout(init, 500);
    </script>
</body>
</html>
